<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaiwanHistory-Wiki | 台灣歷史 LLM 知識庫</title>
  <style>
    :root {
      --bg: #f8fafc;
      --sidebar-bg: #0f172a;
      --sidebar-text: #e2e8f0;
      --card-bg: #ffffff;
      --primary: #0284c7;
      --primary-light: #e0f2fe;
      --accent: #d97706;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }
    /* Sidebar */
    aside {
      width: 300px;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .brand {
      border-bottom: 1px solid #334155;
      padding-bottom: 14px;
    }
    .brand h1 { font-size: 1.2rem; color: #38bdf8; letter-spacing: 0.5px; }
    .brand p { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    .search-box input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 0.9rem;
    }
    .search-box input:focus { outline: 2px solid #38bdf8; }
    .nav-section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 0.92rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item:hover { background: #1e293b; }
    .nav-item.active { background: var(--primary); color: #fff; font-weight: 600; }
    .nav-item .meta { font-size: 0.75rem; opacity: 0.8; }
    .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-chip {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
      border: 1px solid #334155;
    }
    .tag-chip.active, .tag-chip:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    /* Main Content */
    main {
      flex: 1;
      padding: 36px 48px;
      max-width: 960px;
      margin: 0 auto;
    }
    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 36px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .wiki-id {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
    }
    .era-badge {
      background: #fef3c7;
      color: #b45309;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }
    h2.article-title {
      font-size: 1.75rem;
      margin-bottom: 16px;
      color: #0f172a;
      line-height: 1.3;
    }
    .tldr-box {
      background: #f1f5f9;
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 24px;
      font-size: 0.98rem;
      line-height: 1.6;
    }
    .tldr-box strong { color: var(--primary); }
    h3 {
      font-size: 1.15rem;
      margin: 22px 0 10px;
      color: #0f172a;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    ul.fact-list {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      line-height: 1.65;
    }
    .source-box {
      margin-top: 24px;
      padding: 12px 16px;
      background: #fafafa;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .xref-section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .xref-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .wiki-link {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.15s;
    }
    .wiki-link:hover { background: #1d4ed8; color: #fff; }
    @media (max-width: 820px) {
      body { flex-direction: column; }
      aside { width: 100%; height: auto; position: static; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>

          "<strong>知識庫使用規範</strong>：本 Wiki 收錄 5 篇核心時期 Ingest 資料（WIKI-01 至 WIKI-05），所有教學簡報的歷史事實、年代與因果推論皆必須溯源至此知識庫。"

      {

    let currentId = "WIKI-00";
    let activeTag = null;
    let searchQuery = "";

    const navList = document.getElementById("navList");
    const tagCloud = document.getElementById("tagCloud");
    const articleView = document.getElementById("articleView");
    const searchInput = document.getElementById("searchInput");

    function getAllTags() {
      const set = new Set();
      wikiData.forEach(item => item.tags.forEach(t => set.add(t)));
      return Array.from(set);
    }

    function renderSidebar() {
      const filtered = wikiData.filter(item => {
        const matchTag = !activeTag || item.tags.includes(activeTag);
        const q = searchQuery.trim().toLowerCase();
        const matchQuery = !q ||
          item.title.toLowerCase().includes(q) ||
          item.tldr.toLowerCase().includes(q) ||
          item.era.toLowerCase().includes(q) ||
          item.facts.some(f => f.toLowerCase().includes(q));
        return matchTag && matchQuery;
      });

      navList.innerHTML = filtered.map(item => `
        <li class="nav-item ${item.id === currentId ? 'active' : ''}" onclick="selectArticle('${item.id}')">
          <span>${item.id} · ${item.slug.replace(/^\d+_/, '')}</span>
          <span class="meta">${item.era}</span>
        </li>
      `).join("") || `<li style="color:#94a3b8;font-size:0.85rem;padding:8px;">無符合條件的條目</li>`;

      tagCloud.innerHTML = getAllTags().map(tag => `
        <span class="tag-chip ${activeTag === tag ? 'active' : ''}" onclick="toggleTag('${tag}')">${tag}</span>
      `).join("");
    }

    function renderArticle() {
      const article = wikiData.find(item => item.id === currentId) || wikiData[0];
      const xrefButtons = article.xrefs.map(refId => {
        const target = wikiData.find(w => w.id === refId);
        return target
          ? `<button class="wiki-link" onclick="selectArticle('${target.id}')">[[${target.slug}]]</button>`
          : "";
      }).join("");

      articleView.innerHTML = `
        <div class="badge-row">
          <span class="wiki-id">${article.id}</span>
          <span class="era-badge">⏳ ${article.era}</span>
          ${article.tags.map(t => `<span class="wiki-id" style="background:#f1f5f9;color:#475569;">${t}</span>`).join("")}
        </div>
        <h2 class="article-title">${article.title}</h2>
        <div class="tldr-box">
          <strong>核心概念摘要（TL;DR）：</strong>${article.tldr}
        </div>
        <h3>📌 結構化歷史知識要點</h3>
        <ul class="fact-list">
          ${article.facts.map(fact => `<li>${fact}</li>`).join("")}
        </ul>
        <div class="source-box">
          📄 <strong>Knowledge Provenance（知識來源追溯）：</strong>${article.source}
        </div>
        <div class="xref-section">
          <div style="font-size:0.88rem;font-weight:600;color:#475569;">🔗 雙向關聯條目（Cross-References）：</div>
          <div class="xref-links">${xrefButtons}</div>
        </div>
      `;
    }

    function selectArticle(id) {
      currentId = id;
      renderSidebar();
      renderArticle();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleTag(tag) {
      activeTag = (activeTag === tag) ? null : tag;
      renderSidebar();
    }

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderSidebar();
    });

    renderSidebar();
    renderArticle();
  </script>
</body>
</html>
